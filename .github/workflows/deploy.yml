name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CDK_DEFAULT_REGION: us-east-1

jobs:
  # ── Test Backend (Lambda handlers) ─────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt boto3 moto pytest

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v

  # ── Test CDK stack ──────────────────────────────────────────────────────────
  test-cdk:
    name: Test CDK Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cdk/requirements-dev.txt

      - name: Install CDK dependencies
        run: pip install -r cdk/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Synth (validate stack)
        run: |
          cd cdk
          # Create a placeholder dist so BucketDeployment asset resolves
          mkdir -p ../frontend/dist
          echo '{}' > ../frontend/dist/placeholder.json
          cdk synth --context account=123456789012 --context region=us-east-1
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Run CDK tests
        run: python -m pytest cdk/tests/ -v

  # ── Build Frontend ──────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          # Placeholder; overridden by the deploy job once the API URL is known
          VITE_API_URL: https://placeholder.example.com

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Deploy (only on main branch) ───────────────────────────────────────────
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [test-backend, test-cdk, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK Python dependencies
        run: pip install -r cdk/requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Bootstrap (idempotent)
        run: |
          cd cdk
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: CDK Deploy (without frontend – get API URL first)
        id: cdk_deploy
        run: |
          cd cdk
          # Create empty dist placeholder so BucketDeployment asset resolves
          mkdir -p ../frontend/dist
          echo '{}' > ../frontend/dist/placeholder.json
          OUTPUT=$(cdk deploy BookstoreStack --require-approval never --outputs-file ../cdk-outputs.json)
          echo "CDK deploy complete"
          API_URL=$(jq -r '.BookstoreStack.ApiUrl' ../cdk-outputs.json)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend with real API URL
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ steps.cdk_deploy.outputs.api_url }}

      - name: Re-deploy CDK to sync final frontend assets
        run: |
          cd cdk
          cdk deploy BookstoreStack --require-approval never --outputs-file ../cdk-outputs.json

      - name: Print deployment URLs
        run: |
          echo "API URL:        $(jq -r '.BookstoreStack.ApiUrl' cdk-outputs.json)"
          echo "CloudFront URL: $(jq -r '.BookstoreStack.CloudFrontUrl' cdk-outputs.json)"
